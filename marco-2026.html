<script>
function destacarOvitrampas() {

    window.highlightMarkers = window.highlightMarkers || [];

    window.highlightMarkers.forEach(function(marker){
        marker.remove();
    });

    window.highlightMarkers = [];

    var val = document.getElementById('search-input').value;

    if(!val) return;

    var ids = val.split(/[ ,./-]+/);

    ids.forEach(function(id){

        id = id.trim();

        if(id === "") return;

        window.ovitrampas.forEach(function(ov){

            if(ov.id == id){

                for (var i in window){

                    if(window[i] instanceof L.Map){

                        window[i].setView([ov.lat, ov.lon], 18, {
                            animate: true,
                            duration: 1.5
                        });

     var marker = L.circleMarker([ov.lat, ov.lon], {
    radius: 18,
    color: '#db2777',
    fillColor: '#f472b6',
    fillOpacity: 0.9,
    weight: 6
}).addTo(window[i]);

// POPUP AUTOMÁTICO
marker.bindPopup(`
<div style="
    font-family:Arial;
    min-width:100px;
    padding:0px;
    line-height:1.0;
">


    <div style="
        font-size:10px;
        font-weight:800;
        color:#111827;
        margin-bottom:4px;
    ">
         Ovitrampa ${ov.id}
    </div>

    <div style="
        font-size:11px;
        margin-bottom:3px;
    ">
        <b>Ovos:</b> ${ov.ovos}
    </div>

    <div style="
        font-size:11px;
    ">
        <b>Endereço:</b><br>
        ${ov.rua}, ${ov.numero}
    </div>

</div>
`).openPopup();
window.highlightMarkers.push(marker);

                    }
                }

            }

        });

    });

}

function corrigirMapa() {

    for (var i in window){

        if (window[i] instanceof L.Map){

            window[i].invalidateSize();

        }

    }

}
setTimeout(corrigirMapa, 500);
window.addEventListener('resize', corrigirMapa);
</script>
